name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # sin --fix: en CI queremos que falle si hay algo mal, no que lo autocorrija en silencio
      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
